# PadSign public-corpus eval set for the TrustLynx AI assistant.
#
# Append to (or copy into) the consuming app's eval/questions.yaml. Schema is
# theirs; see their eval/README.md.
#
# Derived from this package's own retrieval-smoke.mjs baseline, plus cases for
# the guardrails that only matter once an LLM is in the loop. Ids are prefixed
# `ps` so they cannot collide with existing internal cases.
#
# THREE CATEGORIES, and the distinction matters:
#
#   positive              — the corpus answers it; assert content + source.
#   positive (guardrail)  — the corpus deliberately has no FACT, but does have
#                           the refusal chunk 11-03. The correct behaviour is a
#                           grounded "this is not published, ask TrustLynx",
#                           NOT the canonical no-answer phrase. Tagged
#                           `guardrail`.
#   negative              — genuinely nothing in the corpus; assert the
#                           canonical refusal.
#
# Fifteen of the positives exist because they once retrieved a confidently WRONG
# chunk in lexical testing (pricing returned the ROI testimonial; left-handed
# signing returned the signature-area description). Keep them even if they look
# redundant — they are regression tests, not coverage.
#
# NOTE / suggested upstream addition: this schema has no
# `expected_answer_excludes`. The claim boundaries in doc_qa_system_public.txt
# are prohibitions ("never say PadSign is eIDAS certified"), which cannot be
# asserted positively. Cases tagged `claim_boundary` below are the ones that
# would benefit most from such a field.

